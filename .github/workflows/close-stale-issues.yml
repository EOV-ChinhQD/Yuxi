# This workflow warns and then closes issues and PRs that have had no activity for a specified amount of time.
#
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/actions/stale
name: Mark stale issues and pull requests

on:
  schedule:
  - cron: '40 9 * * *'

jobs:
  stale:

    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
    - uses: actions/stale@v5
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: 'This issue has been marked as stale due to inactivity. It will be closed in 14 days if no further activity occurs.'
        close-issue-message: 'This issue was automatically closed due to 14 days of inactivity. Please reopen if still relevant.'
        stale-issue-label: 'no-issue-activity'
        only-labels: 'to-be-closed'
        days-before-stale: 30
        days-before-close: 14

# GitHub Actions workflow for Ruff code formatting and linting
# Automatically checks and formats Python backend code

name: Ruff Format Check

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**/*.py'
      - 'backend/pyproject.toml'
      - 'Makefile'
      - '.github/workflows/ruff.yml'

permissions:
  contents: write

jobs:
  ruff:
    name: Ruff Format & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.7.2"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run Ruff format check
        id: ruff-format
        run: |
          set +e
          OUTPUT=$(uv run ruff format --check . 2>&1)
          EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          if [ $EXIT_CODE -ne 0 ]; then
            echo "needs_format=true" >> $GITHUB_OUTPUT
            echo "Files needing formatting:"
            echo "$OUTPUT"
          else
            echo "needs_format=false" >> $GITHUB_OUTPUT
            echo "All files cleanly formatted."
          fi
          exit 0

      - name: Format code if needed
        if: steps.ruff-format.outputs.needs_format == 'true'
        run: |
          uv run ruff format .

      - name: Run Ruff lint check & auto-fix
        id: ruff-lint
        run: |
          set +e
          uv run ruff check --fix .
          LINT_EXIT=$?
          echo "lint_exit_code=$LINT_EXIT" >> $GITHUB_OUTPUT
          exit 0

      - name: Commit and push changes
        if: steps.ruff-format.outputs.needs_format == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "style: auto-format code with ruff"
          git push
